#----------------------------------------------------------------
# A complete control mode is an 8 bits flag
# (4bits control mode + 2 yaw mode bits + 2 reference frame bits)
#
# ------------- mode codification (4 bits) ----------------------
#
# unset             = 0 = 0b0000
# hover             = 1 = 0b0001
# acro              = 2 = 0b0010
# attitude          = 3 = 0b0011
# speed             = 4 = 0b0100
# speed_in_a_plane  = 5 = 0b0101
# position          = 6 = 0b0110
# trajectory        = 7 = 0b0111
#
#-------------- yaw codification --------------------------------
#
# angle             = 0 = 0b00
# speed             = 1 = 0b01
#
# frame codification
#
# local_frame_flu   = 0 = 0b00
# global_frame_enu  = 1 = 0b01
# global_frame_lla  = 2 = 0b10
#
#-----------------------------------------------------------------

#---------------- ArduPilot Copter control modes -----------------
#
# Every mode below is streamed as SET_POSITION_TARGET_LOCAL_NED
# (mavros/setpoint_raw/local) with the matching type_mask, in the
# MAVROS local ENU frame (<namespace>/odom).
#
# Modes deliberately NOT offered for ArduPilot:
#   * ACRO: the body rate fields of SET_ATTITUDE_TARGET are documented
#     as "not supported" by the firmware.
#   * ATTITUDE: the thrust field is a climb rate unless the autopilot
#     parameter GUID_OPTIONS bit 3 is set. Enable 0b00110001 below and
#     set attitude_thrust_semantics to "normalized_thrust" if that
#     parameter has been configured.
#   * SPEED_IN_A_PLANE: mixing one position axis with two velocity axes
#     is rejected by ArduPilot, which requires all three axes of a group.
#
#-----------------------------------------------------------------

available_modes:
  - 0b00000000 # UNSET
  - 0b00010000 # HOVER (position hold at the latched pose)
  # - 0b00110001 # ATTITUDE with yaw ANGLE (requires GUID_OPTIONS bit 3)
  - 0b01000001 # SPEED with yaw ANGLE in the GLOBAL_ENU_FRAME
  - 0b01000101 # SPEED with yaw SPEED in the GLOBAL_ENU_FRAME
  - 0b01100001 # POSITION with yaw ANGLE in the GLOBAL_ENU_FRAME
  - 0b01100101 # POSITION with yaw SPEED in the GLOBAL_ENU_FRAME
  - 0b01110001 # TRAJECTORY with yaw ANGLE in the GLOBAL_ENU_FRAME
  - 0b01110101 # TRAJECTORY with yaw SPEED in the GLOBAL_ENU_FRAME